name: reproduce

on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify stored results
        run: python code/make_all.py --check
      - name: Regenerate tables and figures (reuses the stored nested bootstrap)
        run: python code/make_all.py --quick
      - name: Tests, including table-by-table comparison with the paper
        run: python -m pytest -q
